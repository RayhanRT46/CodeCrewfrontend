<!-- Floating Cart Icon -->
<div class="floating-cart" (click)="toggleCart()">
  <i class="bi bi-cart4"></i>
  <span class="badge bg-danger">{{ cartItems.length }}</span>
</div>

<!-- Cart Modal -->
<div class="cart-modal" [class.show]="showCart">
  <div class="cart-content shadow-lg p-3">
    <h5 class="text-center mb-3">🛒 Your Cart</h5>

    <div *ngIf="cartItems.length === 0" class="text-center text-muted">No items yet.</div>

    <div *ngFor="let item of cartItems" class="cart-item d-flex align-items-center mb-3">
      <!-- Select checkbox -->
      <input type="checkbox" [(ngModel)]="item.selected" (change)="toggleSelect(item.id)" class="form-check-input me-2">

      <!-- Product Image -->
      <img *ngIf="item.image" [src]="item.image" alt="{{ item.name }}" class="cart-img me-2">

      <!-- Product Info -->
      <div class="flex-grow-1">
        <div class="fw-semibold">{{ item.name }}</div>
        <div class="text-muted small">${{ item.price }}</div>
        <!-- Quantity Controls -->
        <div class="d-flex align-items-center mt-1">
          <button class="btn btn-sm btn-outline-secondary me-1" (click)="decrease(item)" [disabled]="item.qty <= 1">-</button>
          <span class="mx-2">{{ item.qty }}</span>
          <button class="btn btn-sm btn-outline-secondary ms-1" (click)="increase(item)">+</button>

        </div>
      </div>

      <!-- Remove Button -->
      <button class="btn btn-sm btn-outline-danger ms-2" (click)="removeItem(item.id)">
        <i class="bi bi-trash"></i>
      </button>
    </div>

    <hr>

    <!-- Total -->
    <div class="d-flex justify-content-between fw-semibold mb-2">
      <span>Total:</span>
      <span>${{ totalPrice.toFixed(2) }}</span>
    </div>

    <!-- Checkout Button -->
    <button class="btn btn-success w-100" (click)="checkout()">Checkout</button>
  </div>
</div>
