<div class="card shadow-sm p-4 mb-4 register-form mx-auto" style="max-width: 500px;">
  <h2 class="fw-bold mb-4 text-center">
    <i class="bi bi-plus-square text-primary me-2"></i> Add Brand
  </h2>

  <form [formGroup]="brandForm" (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <input type="text" class="form-control" placeholder="Brand Name" formControlName="name">
      <div class="text-danger small mt-1" *ngIf="brandForm.get('name')?.invalid && brandForm.get('name')?.touched">
        Brand name is required
      </div>
    </div>

    <div class="mb-3">
      <input type="file" accept="image/*" class="form-control" (change)="onFileChange($event)">
      <div class="text-danger small mt-1" *ngIf="brandForm.get('imageFile')?.invalid && brandForm.get('imageFile')?.touched">
        Brand logo is required
      </div>
    </div>

    <div class="d-grid mb-2">
      <button type="submit" class="btn btn-primary btn-lg">
        <i class="bi bi-check-lg me-1"></i> Save Brand
      </button>
    </div>
  </form>

  <div class="d-grid">
    <button type="button" class="btn btn-outline-secondary" (click)="onBackClick()">
      <i class="bi bi-arrow-left me-1"></i> Back
    </button>
  </div>

  <p class="mt-3 text-center text-success fw-bold" *ngIf="message">{{ message }}</p>
</div>
