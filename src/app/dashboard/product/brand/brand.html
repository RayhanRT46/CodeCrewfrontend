<div class="user-management-container">
  <div *ngIf="message" class="alert text-center" [ngClass]="messageType === 'success' ? 'alert-success' : 'alert-danger'">
    {{ message }}
  </div>

  <table class="table table-hover align-middle" *ngIf="brandList.length > 0; else noBrand">
    <thead class="table-light">
      <tr>
        <th>SN</th>
        <th>Name</th>
        <th>Logo</th>
        <th class="text-center">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let brand of brandList; let i = index">
        <td>{{ i + 1 }}</td>

        <td *ngIf="editingUserId !== brand.id">{{ brand.name }}</td>
        <td *ngIf="editingUserId === brand.id">
          <input [(ngModel)]="brand.name" class="form-control form-control-sm" />
        </td>

        <td *ngIf="editingUserId !== brand.id">
          <img [src]="brand.logoUrl" alt="logo" width="60" height="40" style="object-fit:contain">
        </td>
        <td *ngIf="editingUserId === brand.id">
          <input type="file" (change)="onFileChange($event, brand)" accept="image/*" />
        </td>

        <td class="text-center">
          <ng-container *ngIf="editingUserId !== brand.id; else editing">
            <button class="btn btn-sm btn-outline-info me-2" (click)="startEdit(brand.id)">Edit</button>
            <button class="btn btn-sm btn-outline-danger" (click)="DeleteBrand(brand.id)">Delete</button>
          </ng-container>
          <ng-template #editing>
            <button class="btn btn-sm btn-outline-success me-2" (click)="saveEdit(brand)">Save</button>
            <button class="btn btn-sm btn-outline-secondary" (click)="cancelEdit()">Cancel</button>
          </ng-template>
        </td>
      </tr>
    </tbody>
  </table>

  <ng-template #noBrand>
    <div class="no-users text-center">
      <h5>No Brand Found</h5>
      <p>Try adding a new brand.</p>
    </div>
  </ng-template>
</div>
