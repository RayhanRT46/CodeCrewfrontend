<div class="shop-page container-fluid py-5 bg-light">
  <!-- 🔘 Toggle Button (Visible Only on Mobile) -->
  <button class="btn btn-primary d-lg-none mb-3" (click)="toggleSidebar()">
    <i class="bi bi-filter"></i> Filters
  </button>

  <!-- 🔲 Overlay (Closes Sidebar When Clicked) -->
  <div
    class="sidebar-overlay"
    *ngIf="isSidebarOpen"
    (click)="toggleSidebar()"
  ></div>

  <div class="row ">
    <!-- 🧭 Sidebar Filters -->
    <aside class="col-lg-3 mb-4 sidebar" [class.open]="isSidebarOpen">
      <div class="card shadow-sm border-0">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold text-primary mb-0">Filters</h5>

            <!-- ❌ Close Button (Mobile Only) -->
            <button
              class="btn btn-sm btn-outline-secondary d-lg-none"
              (click)="toggleSidebar()"
            >
              <i class="bi bi-x-lg"></i>
            </button>
          </div>

          <!-- 🔍 Search -->
          <div class="mb-3 text-start">
            <label class="form-label fw-semibold">Search Product</label>
            <div class="input-group">
              <input
                type="text"
                class="form-control"
                placeholder="Search..."
                [(ngModel)]="filter.productName"
              />
              <button class="btn btn-outline-primary" (click)="applyFilters()">
                <i class="bi bi-search"></i>
              </button>
            </div>
          </div>

          <!-- 🏷️ Categories -->
          <div class="mb-3 text-start">
            <h6 class="fw-bold text-secondary">Categories</h6>
            <div *ngFor="let cat of allCategories" class="form-check">
              <input
                class="form-check-input"
                type="checkbox"
                [checked]="filter.categoryIds.includes(cat.id)"
                (change)="onCategoryChange(cat.id, $event)"
                id="cat{{ cat.id }}"
              />
              <label class="form-check-label" for="cat{{ cat.id }}">
                {{ cat.categoryName || cat.name }}
              </label>
            </div>
          </div>

          <!-- 🏢 Brands -->
          <div class="mb-3 text-start">
            <h6 class="fw-bold text-secondary">Brands</h6>
            <div *ngFor="let brand of allBrands" class="form-check">
              <input
                class="form-check-input"
                type="checkbox"
                [checked]="filter.brandIds.includes(brand.id)"
                (change)="onBrandChange(brand.id, $event)"
                id="brand{{ brand.id }}"
              />
              <label class="form-check-label" for="brand{{ brand.id }}">
                {{ brand.name || brand.brandName }}
              </label>
            </div>
          </div>

          <!-- 💰 Price Range -->
          <div class="mb-3 text-start">
            <h6 class="fw-bold text-secondary">Price Range (৳)</h6>
            <div class="d-flex gap-2">
              <input
                type="number"
                class="form-control"
                placeholder="Min"
                [(ngModel)]="filter.minPrice"
              />
              <input
                type="number"
                class="form-control"
                placeholder="Max"
                [(ngModel)]="filter.maxPrice"
              />
            </div>
          </div>

          <!-- ✅ Apply Filters Button -->
          <button class="btn btn-primary w-100 mt-3" (click)="applyFilters()">
            <i class="bi bi-funnel"></i> Apply Filters
          </button>
        </div>
      </div>
    </aside>

    <!-- 🛍️ Product Grid -->
    <main class="col-lg-9">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h5 class="mb-0">{{ totalProducts }} Products Found</h5>
        <small class="text-muted">Page {{ filter.pageNumber }}</small>
      </div>

      <!-- ⏳ Loading -->
      <div *ngIf="isLoading" class="text-center py-5">
        <div class="spinner-border text-primary"></div>
        <p class="mt-3 text-muted">Loading...</p>
      </div>

      <!-- ⚠️ No Products -->
      <div
        *ngIf="!isLoading && products.length === 0"
        class="alert alert-warning text-center"
      >
        No products found.
      </div>

      <!-- 🧩 Product Cards -->
<div class="shop-page">
  <div class="product-grid" *ngIf="!isLoading && products.length > 0">
    <div class="product-card" *ngFor="let product of products">
      <div class="img-wrapper">
        <img
          [src]="formatImageUrl(product.images?.[0]?.imageUrl) || 'https://placehold.co/400x300?text=No+Image'"
          [alt]="product.productName"
        />
        <button class="wishlist-btn">
          <i
            class="bi"
            [ngClass]="
              product.inWishlist
                ? 'bi-heart-fill text-danger'
                : 'bi-heart'
            "
          ></i>
        </button>
      </div>
      <div class="card-body text-center">
        <h6>{{ product.productName }}</h6>
        <p class="category">{{ product.category?.categoryName }}</p>
        <p class="price">
          <span *ngIf="product.salePrice" class="sale">৳{{ product.salePrice }}</span>
          <span [class.line-through]="product.salePrice">৳{{ product.price }}</span>
        </p>
        <div class="btn-group">
          <button class="btn btn-outline-primary btn-sm" (click)="addToCart(product.id)">
            <i class="bi bi-cart-plus"></i> Add to Cart
          </button>
          <button class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-eye"></i> View Details
          </button>
        </div>
      </div>
    </div>
  </div>
</div>


      <!-- 📄 Pagination -->
      <nav *ngIf="totalProducts > filter.pageSize" class="mt-4">
        <ul class="pagination justify-content-center">
          <li class="page-item" [class.disabled]="filter.pageNumber === 1">
            <a class="page-link" (click)="onPageChange(filter.pageNumber - 1)"
              >Prev</a
            >
          </li>

          <li
            class="page-item"
            *ngFor="let p of getPagesArray()"
            [class.active]="p === filter.pageNumber"
          >
            <a class="page-link" (click)="onPageChange(p)">{{ p }}</a>
          </li>

          <li
            class="page-item"
            [class.disabled]="
              filter.pageNumber === getPagesArray().slice(-1)[0]
            "
          >
            <a class="page-link" (click)="onPageChange(filter.pageNumber + 1)"
              >Next</a
            >
          </li>
        </ul>
      </nav>
    </main>
  </div>
</div>
